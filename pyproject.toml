[project]
name = "citecheck"
version = "0.3.0"
description = "Mechanical checks that a claim matches its cited source: quote, link, DOI and drift, and a regression runner."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pypdf[crypto]>=4"]  # crypto: AES-encrypted PDFs, even with an empty password

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
